# 06_mcp — MCP: Both Connection Modes in One Example
#
# Shows both ways to wire MCP tools to an agent:
#
#   1. command:  — spawn a local MCP server as a stdio subprocess
#   2. url:      — connect to an MCP server running somewhere else over HTTP
#
# Both clients are attached to a single agent, giving it calculator tools
# from the local subprocess AND AWS documentation tools from the remote server.
#
# Run:
#   uv run python examples/06_mcp/main.py

models:
  default:
    provider: bedrock
    model_id: openai.gpt-oss-20b-1:0

# ── Clients ───────────────────────────────────────────────────────────────────
mcp_clients:
  # Mode 1 — command: spawn a local MCP server over stdio.
  calc_client:
    command: ["python", "calculator_server.py"]
    params:
      prefix: calc

  # Mode 2 — url: connect to a server you don't run yourself.
  # AWS publicly hosts a Knowledge MCP server; no API key required.
  aws_knowledge:
    url: https://knowledge-mcp.global.api.aws
    transport: streamable-http
    params:
      prefix: aws
      startup_timeout: 30

# ── Agent ─────────────────────────────────────────────────────────────────────
# Both clients are attached — the agent gets calc_* AND aws_* tools.
agents:
  assistant:
    model: default
    mcp:
      - calc_client
      - aws_knowledge
    system_prompt: |
      You are a helpful assistant with two sets of tools:
        - calc_*  — arithmetic (add, multiply, percentage). Always use them for maths.
        - aws_*   — live AWS documentation search. Use them for any AWS questions.
      Cite the documentation source when answering AWS questions.
      Never calculate by hand when a calc tool is available.

entry: assistant
